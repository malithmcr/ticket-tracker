[project]
name = "ticket-tracker-app"
version = "0.1.0"
description = "Ticket tracker internal tool"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=6.0.7",
    "django-htmx>=1.28.0",
    "faker>=40.36.0",
    "gunicorn>=26.0.0",
    "psycopg[binary]>=3.3.4",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.12.0",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-q"

[tool.ruff.lint]
ignore = [
    "RUF012",  # Django Meta uses mutable class attributes by design
]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["ALL"]
"tickets/admin.py" = ["F401"]
