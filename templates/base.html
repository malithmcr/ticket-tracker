<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ticket Tracker{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
    {% block body %}
        <div class="flex min-h-screen">
            {# Desktop sidebar — plain flex, does not rely on DaisyUI drawer-open #}
            <div class="hidden lg:flex shrink-0">
                {% include "partials/sidebar.html" %}
            </div>

            <div class="flex min-w-0 flex-1 flex-col">
                <div class="navbar bg-white border-b border-slate-200 lg:hidden px-4">
                    <div class="flex-none">
                        <label for="mobile-drawer" class="btn btn-square btn-ghost" aria-label="Open menu">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="inline-block w-5 h-5 stroke-current">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                            </svg>
                        </label>
                    </div>
                    <div class="flex-1 px-2 font-semibold">Ticket Tracker</div>
                </div>

                <main class="flex-1 p-4 sm:p-6 lg:p-8">
                    <div class="mx-auto max-w-6xl">
                        {% include "partials/alerts.html" %}
                        {% block content %}{% endblock %}
                    </div>
                </main>
            </div>
        </div>

        {# Mobile drawer #}
        <input id="mobile-drawer" type="checkbox" class="peer hidden">
        <label
            for="mobile-drawer"
            class="fixed inset-0 z-40 hidden bg-black/40 peer-checked:block lg:hidden"
            aria-label="Close menu"
        ></label>
        <div class="fixed inset-y-0 left-0 z-50 w-64 -translate-x-full bg-white shadow-xl transition-transform peer-checked:translate-x-0 lg:hidden">
            {% include "partials/sidebar.html" %}
        </div>
    {% endblock %}
</body>
</html>
