<div class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
    <div class="flex items-center gap-2 text-xs font-semibold uppercase tracking-wide text-slate-500 mb-3">
        {% if icon %}
            <span class="text-slate-400">{{ icon }}</span>
        {% endif %}
        {{ label }}
    </div>
    <p class="text-3xl font-bold tracking-tight text-slate-900">{{ value }}</p>
    {% if hint %}
        <p class="mt-2 text-sm text-slate-500">{{ hint }}</p>
    {% endif %}
</div>
