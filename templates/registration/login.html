{% extends "base.html" %}

{% block title %}Sign in · Ticket Tracker{% endblock %}

{% block body %}
    <main class="flex min-h-screen items-center justify-center bg-slate-50 px-4 py-12">
        <div class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
            <div class="mb-6 flex items-center gap-3">
                <span class="flex h-10 w-10 items-center justify-center rounded-lg bg-amber-400 text-slate-900 font-bold">
                    TT
                </span>
                <div>
                    <h1 class="text-xl font-semibold text-slate-900">Ticket Tracker</h1>
                    <p class="text-sm text-slate-500">Sign in to continue</p>
                </div>
            </div>

            {% if form.errors %}
                <div role="alert" class="alert alert-error mb-4">
                    <span>Invalid username or password.</span>
                </div>
            {% endif %}

            <form method="post" class="space-y-4">
                {% csrf_token %}

                <label class="form-control w-full">
                    <span class="mb-1 text-sm font-medium text-slate-700">Username</span>
                    <input
                        type="text"
                        name="username"
                        autofocus
                        required
                        class="input input-bordered w-full border-slate-200 bg-white"
                        value="{{ form.username.value|default:'' }}"
                    >
                </label>

                <label class="form-control w-full">
                    <span class="mb-1 text-sm font-medium text-slate-700">Password</span>
                    <input
                        type="password"
                        name="password"
                        required
                        class="input input-bordered w-full border-slate-200 bg-white"
                    >
                </label>

                <button type="submit" class="btn btn-neutral w-full mt-4">
                    Sign in
                </button>
            </form>
        </div>
    </main>
{% endblock %}
