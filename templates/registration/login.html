{% extends "base.html" %}

{% block title %}Sign in · Ticket Tracker{% endblock %}

{% block body %}
    <main class="flex min-h-screen items-center justify-center bg-slate-50 px-4 py-12">
                <h1>Sign in</h1>
        
                {% if form.errors %}
                    <p>Invalid username or password.</p>
                {% endif %}
        
                <form method="post">
                    {% csrf_token %}
        
                    {{ form.as_p }}
        
                    <button type="submit">Sign in</button>
                </form>
        
    </main>
{% endblock %}
