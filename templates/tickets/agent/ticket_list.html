{% extends "base.html" %}

{% block title %}Tickets · Ticket Tracker{% endblock %}

{% block content %}
    <div class="mb-6">
        <h1 class="text-3xl font-bold tracking-tight text-slate-900">Tickets</h1>
        <p class="mt-1 text-slate-500">Search and manage support tickets.</p>
    </div>

    <form
        method="get"
        class="mb-4 flex flex-col gap-3 lg:flex-row lg:items-center"
        hx-get="{% url 'tickets:agent_tickets' %}"
        hx-target="#ticket-results"
        hx-push-url="true"
        hx-trigger="keyup changed delay:300ms from:input[name='q'], change from:select"
    >
        <label class="relative flex-1">
            <span class="pointer-events-none absolute inset-y-0 left-3 flex items-center text-slate-400">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M11 19a8 8 0 100-16 8 8 0 000 16z" />
                </svg>
            </span>
            <input
                type="search"
                name="q"
                value="{{ search_query }}"
                placeholder="Search tickets by subject, customer, or description…"
                class="input input-bordered w-full rounded-full bg-white border-slate-200 pl-10 focus:outline-none focus:border-slate-400"
            >
        </label>

        <select name="status" class="select select-bordered rounded-xl bg-white border-slate-200 w-full lg:w-44">
            <option value="">All statuses</option>
            {% for value, label in status_choices %}
                <option value="{{ value }}" {% if status_filter == value %}selected{% endif %}>
                    {{ label }}
                </option>
            {% endfor %}
        </select>

        <select name="priority" class="select select-bordered rounded-xl bg-white border-slate-200 w-full lg:w-44">
            <option value="">All priorities</option>
            {% for value, label in priority_choices %}
                <option value="{{ value }}" {% if priority_filter == value %}selected{% endif %}>
                    {{ label }}
                </option>
            {% endfor %}
        </select>

        <noscript>
            <button type="submit" class="btn btn-neutral rounded-xl">Filter</button>
        </noscript>
    </form>

    <div id="ticket-results">
        {% include "tickets/partials/agent_ticket_list.html" %}
    </div>
{% endblock %}
